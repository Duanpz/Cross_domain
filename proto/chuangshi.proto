syntax = "proto3";

package chuangshi;

service MetadataService {
    rpc CreateFile(CreateRequest) returns (CreateResponse);
    rpc ReadFile(ReadRequest) returns (ReadResponse);
    rpc DeleteFile(DeleteRequest) returns (DeleteResponse);
    rpc ListFiles(ListRequest) returns (ListResponse);
}

service DataNodeService {
    rpc StoreChunk(StoreRequest) returns (StoreResponse);
    rpc RetrieveChunk(RetrieveRequest) returns (RetrieveResponse);
}

message CreateRequest {
    string path = 1;
    uint64 size = 2;
    string owner = 3;
}

message CreateResponse {
    bool success = 1;
    string error = 2;
}

message ReadRequest {
    string path = 1;
}

message ReadResponse {
    bytes content = 1;
    string error = 2;
}

message DeleteRequest {
    string path = 1;
}

message DeleteResponse {
    bool success = 1;
    string error = 2;
}

message ListRequest {
    string dir = 1;
}

message ListResponse {
    repeated string files = 1;
    string error = 2;
}

message StoreRequest {
    string chunk_id = 1;
    bytes data = 2;
}

message StoreResponse {
    bool success = 1;
    string error = 2;
}

message RetrieveRequest {
    string chunk_id = 1;
}

message RetrieveResponse {
    bytes data = 1;
    string error = 2;
}

message ChunkInfo {
    string chunk_id = 1;
    uint32 shard_count = 2;
    uint64 timestamp = 3;
    uint64 size = 4;
}