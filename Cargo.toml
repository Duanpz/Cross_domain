[workspace]
members = [
    "gmm",
    "rmn",
    "dn",
    "sdk",
    "cli"
, "benchmark"]
resolver = "2"  

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
prost-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-stream = "0.1"
raft = "0.7"
reed-solomon-erasure = "=4.0.2"
log = "0.4"
env_logger = "0.10"
fuser = "0.11"
rand = "0.8"
clap = { version = "4", features = ["derive"] }


